# docker compose up -d     (or: podman compose up -d)
# Then: docker compose logs meridian   — the first Admin's password is printed once.
services:
  meridian:
    build: .
    image: meridian:latest
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - meridian-data:/data
    environment:
      # A long random value: the key all data is encrypted with. Keep a copy in your password vault; backups cannot be
      # read without it. Without it a key file is made in /data.
      CC_SECRET: ${CC_SECRET:-}
      # HTTPS on 8443 with a self-signed certificate for these names, until TLS_CERT_FILE + TLS_KEY_FILE name your own.
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      CC_ADMIN_EMAIL: ${CC_ADMIN_EMAIL:-admin@meridian.local}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-10}
      # Auto-update from the private GitHub repository: a read-only token (fine-grained, Contents: read). Every push to main
      # is published as a release and installed here within 15 minutes.
      CC_UPDATE_TOKEN: ${CC_UPDATE_TOKEN:-}
      # Where each backup is also copied (mount a share or a second disk there).
      CC_BACKUP_DIR: ${CC_BACKUP_DIR:-}
      CC_PUBLIC_URL: ${CC_PUBLIC_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  meridian-data:
