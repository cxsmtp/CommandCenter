# Publishing a release: push a tag such as v1.0.1 (the same version as package.json).
# It builds the bundle servers update themselves from (Settings → Update & recovery), its SHA256SUMS
# (signed when the RELEASE_SIGNING_KEY secret holds an Ed25519 private key), and the container image.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm ci --omit=dev
      - name: Bundle
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/bundle.mjs dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/commandcenter-*.tar.gz dist/SHA256SUMS $(ls dist/SHA256SUMS.sig 2>/dev/null) --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        run: |
          IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" .
