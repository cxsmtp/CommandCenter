# Every push to main is a release, the way the FTR command center does it: running servers find it within 15 minutes
# (Settings → System & backups) and install it by themselves, with a checked backup first and a rollback if it does
# not start.
#
# The version is made here, so nobody has to remember to bump it: the major.minor from package.json, and the number of
# commits on main as the patch (1.0.<n>) — always higher than the release before. A v* tag publishes that exact
# version instead (it must match package.json). Each release carries meridian-<version>.tar.gz and SHA256SUMS (signed
# when the RELEASE_SIGNING_KEY secret holds an Ed25519 private key), and the container image goes to ghcr.io.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The version, and whether it is released already
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            test "$v" = "$(node -p "require('./package.json').version")" || { echo "The tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          else
            v="$base.$(git rev-list --count HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=yes" >> "$GITHUB_OUTPUT"; echo "v$v is released already."; else echo "exists=no" >> "$GITHUB_OUTPUT"; fi
      - name: Stamp the version
        if: steps.v.outputs.exists == 'no'
        run: npm pkg set version=${{ steps.v.outputs.version }}
      - if: steps.v.outputs.exists == 'no'
        run: npm ci
      - if: steps.v.outputs.exists == 'no'
        run: npm test
      - if: steps.v.outputs.exists == 'no'
        run: npm ci --omit=dev
      - name: Bundle
        if: steps.v.outputs.exists == 'no'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/bundle.mjs dist
      - name: Publish the release
        if: steps.v.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/meridian-*.tar.gz dist/SHA256SUMS $(ls dist/SHA256SUMS.sig 2>/dev/null) \
            --target "$GITHUB_SHA" --title "Meridian ${{ steps.v.outputs.version }}" --generate-notes --latest
      - if: steps.v.outputs.exists == 'no'
        uses: docker/setup-buildx-action@v3
      - if: steps.v.outputs.exists == 'no'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        if: steps.v.outputs.exists == 'no'
        run: |
          IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$IMAGE:${{ steps.v.outputs.version }}" -t "$IMAGE:latest" .
